hydra:
  run:
    dir: artefacts/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: artefacts/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(cyan)s%(threadName)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      debug_handler:
        class: logging.FileHandler
        filename: train.log
        level: DEBUG
        formatter: colorlog
    root:
      level: INFO
      handlers:
      - console
      - debug_handler
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.job.chdir=True
    - hydra.mode=RUN
    task:
    - model=lr
    - feature.categorical_encoder=target
    - dataset.input_data_path=/Users/khubbatulinmark/side-project/SCHOOL21/sber-21-rudn/production/AI_Data_Engineering.Project_2.ID_1577980/datasets/olist_public_dataset_v2.csv
  job:
    name: train
    chdir: true
    override_dirname: dataset.input_data_path=/Users/khubbatulinmark/side-project/SCHOOL21/sber-21-rudn/production/AI_Data_Engineering.Project_2.ID_1577980/datasets/olist_public_dataset_v2.csv,feature.categorical_encoder=target,model=lr
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/khubbatulinmark/side-project/SCHOOL21/sber-21-rudn/solutions/03-de/project_2/solution
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/khubbatulinmark/side-project/SCHOOL21/sber-21-rudn/solutions/03-de/project_2/solution/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/khubbatulinmark/side-project/SCHOOL21/sber-21-rudn/solutions/03-de/project_2/solution/artefacts/2026-04-23_09-34-44
    choices:
      feature: base
      dataset: base
      split: base
      model: lr
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: log
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
